# MCP连接器 插件（DSH Bundle patch）
# 作为 bundle 被合入 profile 时，自动插入本插件行。
# 插件负责连接器目录、三通道连接、凭证存储与 mcp-client 条目动态配置。
- insert:
    - id: mcp-connector
      name: 'dsh-auditor-mcp-connector'
      config:
        catalogUrl: 'https://cdn.jsdelivr.net/gh/duhu2000/dsh-mcp-connector-registry@main/catalog.json'
        # 自更新检查源：本插件所在仓库（上海市审计科学研究所维护分支）内的 package.json。
        # 也可填 GitHub 目录页：https://github.com/thinkvisionjin/dsh-plugins/tree/main/dsh-auditor-mcp-connector
        updateSourceUrl: 'https://cdn.jsdelivr.net/gh/thinkvisionjin/dsh-plugins@main/dsh-auditor-mcp-connector/package.json'
        updateSourceFallbackUrl: 'https://raw.githubusercontent.com/thinkvisionjin/dsh-plugins/main/dsh-auditor-mcp-connector/package.json'
        persistSecrets: true
        entryPrefix: 'mcp'
        refreshSkewMs: 300000
        openBrowser: true
        showSidebarEntry: true
